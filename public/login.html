<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabinetga Kirish | innocode.uz</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    
    .navbar {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
    }
    
    .auth-container {
      max-width: 480px;
      margin: 60px auto 80px;
      padding: 0 20px;
      flex-grow: 1;
      width: 100%;
    }
    
    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 40px 35px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    
    .card-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #4f46e5, #0ea5e9);
    }
    
    .auth-icon-wrap {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 20px;
      background: #eef2ff;
      color: #4f46e5;
    }
    
    .auth-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    
    .auth-desc {
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #334155;
      font-size: 0.85rem;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.3s;
      background: #f8fafc;
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #4f46e5;
      background: white;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }
    
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.25s;
    }
    
    .btn-submit:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }
    
    .auth-links {
      margin-top: 25px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.9rem;
      color: #64748b;
    }
    
    .auth-links a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }
    
    .auth-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .auth-container {
        margin: 25px auto 40px;
        padding: 0 16px;
      }
      .auth-card {
        padding: 28px 20px;
        border-radius: 20px;
      }
      .auth-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class='navbar'>
    <div class='container'>
      <div class='navbar-inner' style='display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: 15px;'>
        <a href='/' class='brand' style='display: flex; align-items: center; text-decoration: none;'>
          <img src="/img/logo.jpg" alt="innocode.uz logo" style="height: 50px; object-fit: contain; mix-blend-mode: multiply;">
          <span style="font-size: 1.2rem; font-weight: 900; color: #1e293b; letter-spacing: -0.5px; margin-left: 5px;">innocode.uz</span>
        </a>
        <ul class='nav-links' style='display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; flex: 1; justify-content: center; align-items: center; flex-wrap: nowrap; white-space: nowrap; font-size: 0.85rem;'>
          <li><a href='/' style='text-decoration:none; color:var(--text-secondary); font-weight:600; transition: color 0.3s;'>Bosh sahifa</a></li>
          <li><a href='/yangiliklar.html' style='text-decoration:none; color:var(--text-secondary); font-weight:600; transition: color 0.3s;'>Yangiliklar</a></li>
          <li><a href='/yunalishlar.html' style='text-decoration:none; color:var(--text-secondary); font-weight:600; transition: color 0.3s;'>Yo‘nalishlar</a></li>
          <li><a href='/kutubxona.html' style='text-decoration:none; color:var(--text-secondary); font-weight:600; transition: color 0.3s;'>Kutubxona</a></li>
          <li><a href='/haqida.html' style='text-decoration:none; color:var(--text-secondary); font-weight:600; transition: color 0.3s;'>Sayt haqida</a></li>
        </ul>
        <div class='nav-right' style='display: flex; gap: 10px; align-items: center;'>
          <a href="/" class='btn' style='background: #f1f5f9; border: 1px solid #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.82rem; cursor: pointer;'>⬅ Orqaga</a>
          <a href='/register.html' class='btn' style='background: #5a5ce6; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 0.82rem;'>Ro‘yxatdan o‘tish</a>
          <a href='/teacher-login.html' class='btn' style='background: #f8fafc; border: 1px solid #cbd5e1; color: #6d28d9; padding: 6px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 0.82rem;'>👨‍🏫 O‘qituvchi</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card-stripe"></div>
      <div class="auth-icon-wrap">🔑</div>
      <h1 class="auth-title">Kabinetga Kirish</h1>
      <p class="auth-desc">O‘quvchi login va parolingiz orqali darslaringizni davom ettiring.</p>

      <form id="form-login" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">Loginingiz *</label>
          <input id="l-user" type="text" class="form-input" placeholder="Masalan: jasur_4821" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Parol yoki PIN kod *</label>
          <input id="l-pin" type="password" class="form-input" placeholder="Parolingizni kiriting..." required>
        </div>
        <button type="submit" class="btn-submit">Kabinetga Kirish ➔</button>
      </form>

      <div class="auth-links">
        Hisobingiz yo‘qmi? <a href="/register.html">Ro‘yxatdan o‘tish</a>
        <div style="margin-top: 10px;">
          O‘qituvchimisiz? <a href="/teacher-login.html" style="color: #6d28d9;">O‘qituvchi paneli ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('l-user').value.trim();
      const pin_code = document.getElementById('l-pin').value.trim();
      
      try {
        const r = await fetch('/api/auth/login-student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, pin_code })
        });
        const data = await r.json();
        if(data.error) {
          alert(data.error);
        } else {
          Auth.setSession(data.token, data.user);
          window.location.href = (data.user && data.user.role === 'teacher') ? '/teacher.html' : '/student.html';
        }
      } catch(err) {
        alert("Server bilan ulanishda xatolik yuz berdi");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const usr = Auth.getUser();
      if (usr) {
        window.location.href = usr.role === 'teacher' ? '/teacher.html' : '/student.html';
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        const usr = Auth.getUser();
        if (usr) {
          window.location.replace(usr.role === 'teacher' ? '/teacher.html' : '/student.html');
        }
      }
    });
  </script>
</body>
</html>
